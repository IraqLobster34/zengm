				stroke-opacity: 0.85; /* Halo opacity */

							{ name: "extends", total_count: 1, children: [] },
							{ name: "include", total_count: 1, children: [] },
							{ name: "jsx", total_count: 1, children: [] },
							{ name: "lib", total_count: 1, children: [] },
							{ name: "types", total_count: 1, children: [] },
						],
					},
					{
						name: "vitest.config.ts",
						total_count: 4,
						children: [
							{ name: "baseballTests", total_count: 1, children: [] },
							{ name: "benchmark", total_count: 1, children: [] },
							{ name: "footballTests", total_count: 1, children: [] },
							{ name: "makeProject()", total_count: 1, children: [] },
						],
					},
				],
			};

			function transformData(jsonData) {
				// Helper function to recursively build the children structure
				function processNode(node, parentL1StageName) {
					let displayName = node.name;
					// Append total_count if it exists and is not already in the name
					if (node.total_count !== undefined) {
						if (!/\(Total Count: \d+\)$/.test(displayName)) {
							displayName += ` (Total Count: ${node.total_count})`;
						}
					}

					const newNode = { name: displayName };

					if (parentL1StageName === "Root") {
						newNode.originalStageName = node.name;
					} else {
						newNode.originalStageName = parentL1StageName;
					}

					if (node.children && node.children.length > 0) {
						const stageNameToPass =
							parentL1StageName === "Root" ? node.name : parentL1StageName;
						newNode.children = node.children.map((child) =>
							processNode(child, stageNameToPass),
						);
					}

					return newNode;
				}

				let rootDisplayName = jsonData.name;
				if (
					jsonData.total_count !== undefined &&
					!/\(Total Count: \d+\)$/.test(rootDisplayName)
				) {
					rootDisplayName += ` (Total Count: ${jsonData.total_count})`;
				}

				return {
					name: rootDisplayName,
					originalStageName: "Root",
					children: (jsonData.children || []).map((child) =>
						processNode(child, "Root"),
					),
				};
			}

			const treeData = transformData(initialJsonData);

			// Auto-populated phaseColors: every depth-1 child of the root gets
			// a stable colour from a bigger palette so all top-level dirs are
			// distinguishable.
			const PALETTE = [
				["#3498DB", "#2980B9", "#AED6F1"],
				["#2ECC71", "#27AE60", "#A9DFBF"],
				["#E74C3C", "#C0392B", "#F5B7B1"],
				["#9B59B6", "#8E44AD", "#D7BDE2"],
				["#F39C12", "#D68910", "#FAD7A0"],
				["#1ABC9C", "#117864", "#A2D9CE"],
				["#34495E", "#1B2631", "#ABB2B9"],
				["#E67E22", "#BA4A00", "#F5CBA7"],
				["#16A085", "#0E6655", "#A2D9CE"],
				["#D35400", "#A04000", "#EDBB99"],
				["#7F8C8D", "#566573", "#D5DBDB"],
				["#C0392B", "#7B241C", "#F5B7B1"],
				["#2E86C1", "#1B4F72", "#A9CCE3"],
				["#28B463", "#196F3D", "#A9DFBF"],
				["#AF7AC5", "#6C3483", "#D2B4DE"],
			];
			const phaseColors = {
				Root: { fill: "#4A4A4A", stroke: "#333333", collapsedFill: "#6C757D" },
				Default: {
					fill: "#BDC3C7",
					stroke: "#95A5A6",
					collapsedFill: "#ECF0F1",
				},
			};
			(initialJsonData.children || []).forEach((c, i) => {
				const pal = PALETTE[i % PALETTE.length];
				phaseColors[c.name] = {
					fill: pal[0],
					stroke: pal[1],
					collapsedFill: pal[2],
				};
			});

			const levelSpecificPalettes = {
				0: { fill: "#4A4A4A", stroke: "#333333", collapsedFill: "#6C757D" },
				2: { fill: "#6ab04c", stroke: "#508a38", collapsedFill: "#a3d391" },
				3: { fill: "#f0932b", stroke: "#d0730f", collapsedFill: "#f6c07e" },
				4: { fill: "#be2edd", stroke: "#a01cb3", collapsedFill: "#e08bf2" },
				5: { fill: "#00a8ff", stroke: "#007ac1", collapsedFill: "#74d2ff" },
				6: { fill: "#e55039", stroke: "#c23620", collapsedFill: "#f09a8d" },
				default: {
					fill: "#747d8c",
					stroke: "#57606f",
					collapsedFill: "#a4b0be",
				},
			};

			const svgElement = d3.select("#tree-svg");
			const initialSvgWidth = +svgElement.attr("width");
			const initialSvgHeight = +svgElement.attr("height");
			const margin = { top: 40, right: 120, bottom: 80, left: 450 };
			let width = initialSvgWidth - margin.left - margin.right;
			let height = initialSvgHeight - margin.top - margin.bottom;
			const duration = 500;
			let nodeCounter = 0;
			const g = svgElement
				.append("g")
				.attr("transform", `translate(${margin.left},${margin.top})`);
			const treemap = d3.tree().nodeSize([40, 0]);
			let rootNode = d3.hierarchy(treeData, (d) => d.children);
			rootNode.x0 = 0;
			rootNode.y0 = 0;

			if (rootNode.children) {
				rootNode.children.forEach((d_child) => {
					if (d_child.children) {
						collapseBranch(d_child);
					}
				});
			}
			updateTree(rootNode);

			function collapseBranch(d) {
				if (d.children) {
					d._children = d.children;
					d._children.forEach(collapseBranch);
					d.children = null;
				}
			}
			function expandBranch(d) {
				if (d._children) {
					d.children = d._children;
					d._children = null;
				}
				if (d.children) {
					d.children.forEach(expandBranch);
				}
			}
			window.expandAll = () => {
				expandBranch(rootNode);
				updateTree(rootNode);
			};
			window.collapseAll = () => {
				if (rootNode.children) {
					rootNode.children.forEach(collapseBranch);
				}
				updateTree(rootNode);
			};
			window.resetView = () => {
				if (rootNode.children) {
					rootNode.children.forEach((d_child) => {
						if (d_child.children || d_child._children) {
							collapseBranch(d_child);
						}
					});
				}
				if (rootNode._children && !rootNode.children) {
					rootNode.children = rootNode._children;
					rootNode._children = null;
				}
				updateTree(rootNode);
			};

			function updateTree(source) {
				const treeLayoutData = treemap(rootNode);
				let nodes = treeLayoutData.descendants();
				let links = treeLayoutData.descendants().slice(1);

				let minX = 0;
				let maxX = 0;
				if (nodes.length > 0) {
					minX = d3.min(nodes, (d) => d.x);
					maxX = d3.max(nodes, (d) => d.x);
				}

				let neededHeight = Math.max(
					initialSvgHeight,
					maxX - minX + margin.top + margin.bottom + 100,
				);
				svgElement
					.transition()
					.duration(duration / 2)
					.attr("height", neededHeight);
				g.transition()
					.duration(duration / 2)
					.attr(
						"transform",
						`translate(${margin.left},${margin.top - minX + 40})`,
					);

				nodes.forEach((d) => {
					d.y = d.depth * 400;
				}); // Adjust horizontal separation if needed

				const node = g
					.selectAll("g.node")
					.data(nodes, (d) => d.id || (d.id = ++nodeCounter));
				const nodeEnter = node
					.enter()
					.append("g")
					.attr(
						"class",
						(d) =>
							"node" +
							(d.children || d._children ? " node--internal" : " node--leaf") +
							(d._children ? " _children" : ""),
					)
					.attr("transform", (d) => `translate(${source.y0},${source.x0})`)
					.on("click", (event, d) => {
						if (d.children) {
							d._children = d.children;
							d.children = null;
						} else if (d._children) {
							d.children = d._children;
							d._children = null;
						}
						updateTree(d);
					})
					.style("cursor", (d) =>
						d.children || d._children ? "pointer" : "default",
					);

				nodeEnter.append("circle").attr("r", 1e-6);

				nodeEnter
					.append("text")
					.attr("dy", ".35em")
					.attr("x", (d) => (d.children || d._children ? -14 : 14))
					.attr("text-anchor", (d) =>
						d.children || d._children ? "end" : "start",
					)
					.style("fill-opacity", 1e-6)
					.call(wrapText, 380);

				const nodeUpdate = nodeEnter.merge(node);
				nodeUpdate
					.transition()
					.duration(duration)
					.attr("transform", (d) => `translate(${d.y},${d.x})`)
					.attr(
						"class",
						(d) =>
							"node" +
							(d.children ? " node--internal" : " node--leaf") +
							(d._children ? " node--internal _children" : ""),
					);

				nodeUpdate
					.select("circle")
					.attr("r", 8.5)
					.style("fill", (d) => {
						let palette;
						if (d.depth === 0) {
							palette = levelSpecificPalettes[0];
						} else if (d.depth === 1) {
							palette =
								phaseColors[d.data.originalStageName] || phaseColors.Default;
						} else {
							palette =
								levelSpecificPalettes[d.depth] || levelSpecificPalettes.default;
						}
						if (d._children) return palette.collapsedFill;
						if (d.children) return palette.fill;
						return "#fff";
					})
					.style("stroke", (d) => {
						let palette;
						if (d.depth === 0) {
							palette = levelSpecificPalettes[0];
						} else if (d.depth === 1) {
							palette =
								phaseColors[d.data.originalStageName] || phaseColors.Default;
						} else {
							palette =
								levelSpecificPalettes[d.depth] || levelSpecificPalettes.default;
						}
						return palette.stroke;
					});
				nodeUpdate.select("text").style("fill-opacity", 1).call(wrapText, 380);

				const nodeExit = node
					.exit()
					.transition()
					.duration(duration)
					.attr("transform", (d) => `translate(${source.y},${source.x})`)
					.remove();
				nodeExit.select("circle").attr("r", 1e-6);
				nodeExit.select("text").style("fill-opacity", 1e-6);

				const link = g.selectAll("path.link").data(links, (d) => d.id);
				const linkEnter = link
					.enter()
					.insert("path", "g")
					.attr("class", "link")
					.attr("d", (d) => {
						const o = { x: source.x0, y: source.y0 };
						return diagonal(o, o);
					});

				linkEnter
					.merge(link)
					.transition()
					.duration(duration)
					.attr("d", (d) => diagonal(d, d.parent))
					.style("stroke", (d) => {
						const sourceNode = d.parent;
						if (!sourceNode) return phaseColors.Default.stroke;
						const l1AncestorName = sourceNode.data.originalStageName;
						const colorPalette =
							phaseColors[l1AncestorName] || phaseColors.Default;
						return colorPalette.stroke;
					});
				link
					.exit()
					.transition()
					.duration(duration)
					.attr("d", (d) => {
						const o = { x: source.x, y: source.y };
						return diagonal(o, o);
					})
					.remove();
				nodes.forEach((d) => {
					d.x0 = d.x;
					d.y0 = d.y;
				});
			}

			function diagonal(s, d) {
				return `M ${s.y} ${s.x} C ${(s.y + d.y) / 2} ${s.x}, ${(s.y + d.y) / 2} ${d.x}, ${d.y} ${d.x}`;
			}

			function wrapText(textElements, maxWidth) {
				const textPartColors = {
					name: "#343a40",
					count: "#0056b3",
				};
				const countRegex = /(\s\(Total Count: \d+\))$/;

				textElements.each(function () {
					const textD3 = d3.select(this);
					const originalNodeText = textD3.datum().data.name;
					const x = parseFloat(textD3.attr("x") || 0);
					const initialDy = textD3.attr("dy");
					const textAnchor = textD3.attr("text-anchor");
					const lineHeight = 1.1;

					textD3.text(null);

					let namePart = originalNodeText;
					let countPartText = "";

					const countMatch = originalNodeText.match(countRegex);
					if (countMatch && originalNodeText.endsWith(countMatch[0])) {
						namePart = originalNodeText
							.substring(0, originalNodeText.length - countMatch[0].length)
							.trim();
						countPartText = countMatch[0].trim();
					}

					const tokens = [];
					namePart
						.split(/\s+/)
						.filter(Boolean)
						.forEach((word) => {
							tokens.push({ text: word, type: "name" });
						});
					if (countPartText) {
						tokens.push({ text: countPartText, type: "count" });
					}

					if (tokens.length === 0 && originalNodeText) {
						tokens.push({ text: originalNodeText, type: "name" });
					}

					let currentTspan = textD3
						.append("tspan")
						.attr("x", x)
						.attr("dy", initialDy);
					if (textAnchor === "end") currentTspan.attr("text-anchor", "end");

					let lineTokens = [];

					for (let i = 0; i < tokens.length; i++) {
						const tokenObj = tokens[i];

						lineTokens.push(tokenObj);
						currentTspan.text(lineTokens.map((t) => t.text).join(" "));

						if (
							currentTspan.node().getComputedTextLength() > maxWidth &&
							lineTokens.length > 1
						) {
							lineTokens.pop();

							currentTspan.text(null);
							lineTokens.forEach((prevToken, idx) => {
								currentTspan
									.append("tspan")
									.text((idx > 0 ? " " : "") + prevToken.text)
									.style(
										"fill",
										textPartColors[prevToken.type] || textPartColors.name,
									)
									.style(
										"font-weight",
										prevToken.type === "count" ? "bold" : "normal",
									);
							});

							lineTokens = [tokenObj];
							currentTspan = textD3
								.append("tspan")
								.attr("x", x)
								.attr("dy", lineHeight + "em");
							if (textAnchor === "end") currentTspan.attr("text-anchor", "end");
						}
					}

					currentTspan.text(null);
					lineTokens.forEach((token, idx) => {
						currentTspan
							.append("tspan")
							.text((idx > 0 ? " " : "") + token.text)
							.style("fill", textPartColors[token.type] || textPartColors.name)
							.style("font-weight", token.type === "count" ? "bold" : "normal");
					});

					if (
						textD3.selectAll("tspan > tspan").empty() &&
						textD3.select("tspan").text().length === 0 &&
						originalNodeText
					) {
						let t = textD3.select("tspan");
						let displayText = originalNodeText;
						t.text(displayText).style("fill", textPartColors.name);
						if (
							t.node() &&
							t.node().getComputedTextLength() > maxWidth &&
							displayText.length > 20
						) {
							let estimatedChars = Math.floor(
								maxWidth /
									(t.node().getComputedTextLength() / displayText.length),
							);
							displayText =
								displayText.substring(0, Math.max(0, estimatedChars - 3)) +
								"...";
							t.text(displayText);
						}
					}
				});
			}
		</script>
	</body>
</html>
